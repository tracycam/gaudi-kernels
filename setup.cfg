[metadata]
name = gaudi-llm-kernels
version = 0.2.0.dev1
description = Gaudi LLM kernel sources, qualified artifact catalog, and integration contracts
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tracycam/gaudi-kernels
license = Apache-2.0
license_files =
    LICENSE
    NOTICE
    THIRD_PARTY_NOTICES.md
    third_party/*/LICENSE
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: C++
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
package_dir =
    = python
packages = find:
python_requires = >=3.10

[options.packages.find]
where = python

[options.package_data]
gaudi_kernels = catalog.json
gaudi_kernels.serving = startup/sitecustomize.py

[options.entry_points]
console_scripts =
    gaudi-kernels = gaudi_kernels.__main__:main
